# ==============================================================================
# Loon 懒人策略组分流 + 可莉插件整合  v3.3.1
# 本文件由 scripts/build.js 根据 src/ 自动生成，请勿直接修改；修改 src/ 后执行 npm run build。
# 配置地址：https://cdn.jsdelivr.net/gh/alloflights/shadowrocket-rules@main/Loon_LazyGroup.conf
#
# 使用：配置 > 从 URL 下载配置 粘贴上面的地址；再到 配置 > 订阅节点 添加机场订阅。
# 去广告需要 MitM：配置 > MitM > 生成并安装证书，到 设置 > 通用 > 关于本机 > 证书信任设置 中信任；
#   同页打开「MitM over HTTP/2」（YouTube、贴吧等需要）。
# 分流与 Shadowrocket 版完全一致：本地规则只放 Apple / 关键服务保护，分流全部是远程规则（优先级低于插件，
#   这样可莉插件和自研插件里的去广告规则才不会被 DIRECT 分流规则盖掉）。
# ==============================================================================

[General]
# ---------- 直连提速 ----------
# 只用 IPv4：不查询 AAAA、不尝试 IPv6 回落，直连首包更快（与 Shadowrocket 版 ipv6 = false 一致）
ip-mode = ipv4-only
ipv6-vif = off
# DNS：系统 DNS（校园网 / 运营商就近解析，CDN 调度最准）与阿里、腾讯 UDP DNS 并发，取最先返回的结果。
# 不配置 DoH：Loon 只要配置了加密 DNS 就会优先使用它，每次查询多 1~2 个 RTT。代理流量的域名在节点端解析，不受影响。
dns-server = system,223.5.5.5,119.29.29.29
hijack-dns = 8.8.8.8:53,8.8.4.4:53
# 去广告域名在 DNS 阶段直接返回 127.0.0.1，App 立刻失败，不会建立连接再等待超时
domain-reject-mode = DNS
dns-reject-mode = LOOPBACKIP
# 中国大陆 IP 库（只含 CN，GEOIP,CN 判定更准）
geoip-url = https://cdn.jsdelivr.net/gh/Hackl0us/GeoIP2-CN@release/Country.mmdb

# ---------- 系统服务保护 ----------
# TUN 旁路：局域网、17.0.0.0/8 (Apple)、fe80::/10 (AWDL 隔空投送)、组播地址不进隧道，保证 AirDrop / 接力 / 通用剪贴板
bypass-tun = 10.0.0.0/8,17.0.0.0/8,127.0.0.0/8,169.254.0.0/16,172.16.0.0/12,192.0.0.0/24,192.0.2.0/24,192.88.99.0/24,192.168.0.0/16,198.51.100.0/24,203.0.113.0/24,224.0.0.0/4,255.255.255.255/32,239.255.255.250/32,fe80::/10,ff00::/8,ff02::fb/128,localhost,*.local
# 跳过代理：Apple 核心服务、局域网、12306 / 政务 / 银行 / 支付 / 运营商等关键服务（来自 src/rules/05-critical.list）
skip-proxy = 192.168.0.0/16,10.0.0.0/8,17.0.0.0/8,172.16.0.0/12,100.64.0.0/10,localhost,*.local,captive.apple.com,*.apple.com,*.apple.com.cn,*.icloud.com,*.icloud.com.cn,*.icloud-content.com,*.push.apple.com,*.mzstatic.com,*.aaplimg.com,*.cdn-apple.com,*.itunes.com,*.apple-cloudkit.com,*.apple-dns.net,identity.apple.com,gsa.apple.com,*.12306.cn,*.95306.cn,*.gov.cn,*.edu.cn,*.chsi.com.cn,*.pbccrc.org.cn,*.alipay.com,*.alipay.cn,*.alipayobjects.com,*.antfortune.com,*.mybank.cn,*.tenpay.com,pay.weixin.qq.com,*.unionpay.com,*.unionpaysecure.com,*.95516.com,*.chinaums.com,*.jdpay.com,*.ecny.cn,*.cfca.com.cn,*.icbc.com.cn,*.ccb.com,*.abchina.com,*.abchina.com.cn,*.boc.cn,*.bankofchina.com,*.bankcomm.com,*.psbc.com,*.cmbchina.com,*.cmbimg.com,*.citicbank.com,*.cebbank.com,*.cmbc.com.cn,*.cib.com.cn,*.spdb.com.cn,*.pingan.com,*.pingan.com.cn,*.hxb.com.cn,*.cgbchina.com.cn,*.czbank.com,*.bankofbeijing.com.cn,*.bosc.cn,*.webank.com,*.zj96596.com,*.zjrc.com,*.gffunds.com.cn,*.nffund.com,*.10086.cn,*.chinamobile.com,*.10010.com,*.chinaunicom.cn,*.189.cn,*.chinatelecom.com.cn,*.3gppnetwork.org,*.anticheatexpert.com
# 真实 IP：Apple 认证 / 推送、微软邮件、NTP / STUN、QQ 快捷登录、Wi-Fi 通话、游戏联机
real-ip = *.apple.com,*.icloud.com,*.icloud.com.cn,*.push.apple.com,*.apple-cloudkit.com,*.me.com,*.mzstatic.com,*.cdn-apple.com,*.aaplimg.com,*.itunes.com,*.apple-dns.net,identity.apple.com,gsa.apple.com,captive.apple.com,*.outlook.com,*.office365.com,*.office.com,*.msftconnecttest.com,*.msftncsi.com,time.*.com,ntp.*.com,stun.*.*,stun.*.*.*,*.local,localhost,localhost.ptlogin2.qq.com,localhost.sec.qq.com,localhost.work.weixin.qq.com,*.3gppnetwork.org,*.srv.nintendo.net,*.stun.playstation.net,xbox.*.microsoft.com,*.xboxlive.com,*.battlenet.com.cn,*.battle.net

