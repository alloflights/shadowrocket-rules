[Remote Filter]
# 节点筛选：对本地节点和全部订阅节点生效，自动排除「剩余流量 / 到期时间」等信息节点
全部 = NameRegex, FilterKey = "^((?!(剩余|到期|流量|官网|重置|过期|套餐|Expire|Traffic|官方|客服)).)*$"
AI可用 = NameRegex, FilterKey = "(?=.*(🇺🇸|US|USA|America|United States|美国|🇯🇵|JP|Japan|日本|🇸🇬|SG|Singapore|新加坡|🇹🇼|TW|Taiwan|台湾))^((?!(剩余|到期|流量|官网|重置|过期|套餐|Expire|Traffic|官方|客服)).)*$"
香港 = NameRegex, FilterKey = "(?=.*(🇭🇰|HK|Hong|hong|香港|深港|沪港|京港|港))^((?!(剩余|到期|流量|官网|重置|过期|套餐|Expire|Traffic|官方|客服)).)*$"
台湾 = NameRegex, FilterKey = "(?=.*(🇹🇼|TW|TWN|Taiwan|Taipei|taiwan|台湾|台灣|台北|台中|新北|彰化))^((?!(剩余|到期|流量|官网|重置|过期|套餐|Expire|Traffic|官方|客服)).)*$"
日本 = NameRegex, FilterKey = "(?=.*(🇯🇵|JP|Japan|japan|Tokyo|tokyo|日本|东京|大阪|京日|苏日|沪日|上日|川日|深日|广日|日))^((?!(剩余|到期|流量|官网|重置|过期|套餐|Expire|Traffic|官方|客服)).)*$"
新加坡 = NameRegex, FilterKey = "(?=.*(🇸🇬|SG|Sing|sing|新加坡|狮城|沪新|京新|深新|杭新|广新))^((?!(剩余|到期|流量|官网|重置|过期|套餐|Expire|Traffic|官方|客服)).)*$"
韩国 = NameRegex, FilterKey = "(?=.*(🇰🇷|KR|Korea|korea|KOR|韩国|首尔|韩|韓|春川))^((?!(剩余|到期|流量|官网|重置|过期|套餐|Expire|Traffic|官方|客服)).)*$"
美国 = NameRegex, FilterKey = "(?=.*(🇺🇸|US|USA|America|america|United States|美国|凤凰城|洛杉矶|西雅图|芝加哥|纽约|沪美|美))^((?!(剩余|到期|流量|官网|重置|过期|套餐|Expire|Traffic|官方|客服)).)*$"

