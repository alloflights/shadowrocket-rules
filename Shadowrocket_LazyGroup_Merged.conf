# ==============================================================================
# Shadowrocket 懒人策略组分流  v3.1.0
# 本文件由 scripts/build.js 根据 src/ 自动生成，请勿直接修改；修改 src/ 后执行 npm run build。
# 订阅地址：https://cdn.jsdelivr.net/gh/alloflights/shadowrocket-rules@main/Shadowrocket_LazyGroup_Merged.conf
# 纯分流：AI 专线 / 流媒体 / 社交 / 地区自动测速策略组，国内直连，Apple 原生服务保护。
#
# 本配置只做分流，不含任何去广告内容。去广告请另外添加模块（配置 > 模块 > 右上角 +）：
#   https://cdn.jsdelivr.net/gh/alloflights/shadowrocket-rules@main/modules/adblock-ultimate.sgmodule
# 去广告模块需要 HTTPS 解密：配置文件 ⓘ > HTTPS 解密 > 证书 > 生成新的 CA 证书 > 安装证书，
#   再到 设置 > 通用 > 关于本机 > 证书信任设置 中信任该证书。
# ==============================================================================

[General]
bypass-system = true

# 跳过代理：Apple 核心服务、局域网、12306 / 政务 / 银行 / 支付 / 运营商等关键服务，直接由系统处理，最低延迟、最少干扰。
skip-proxy = 192.168.0.0/16, 10.0.0.0/8, 17.0.0.0/8, 172.16.0.0/12, 100.64.0.0/10, localhost, *.local, captive.apple.com, *.apple.com, *.apple.com.cn, *.icloud.com, *.icloud.com.cn, *.icloud-content.com, *.push.apple.com, *.mzstatic.com, *.aaplimg.com, *.cdn-apple.com, *.itunes.com, *.apple-cloudkit.com, *.apple-dns.net, identity.apple.com, gsa.apple.com, *.12306.cn, *.95306.cn, *.gov.cn, *.edu.cn, *.chsi.com.cn, *.pbccrc.org.cn, *.alipay.com, *.alipay.cn, *.alipayobjects.com, *.antfortune.com, *.mybank.cn, *.tenpay.com, pay.weixin.qq.com, *.unionpay.com, *.unionpaysecure.com, *.95516.com, *.chinaums.com, *.jdpay.com, *.ecny.cn, *.cfca.com.cn, *.icbc.com.cn, *.ccb.com, *.abchina.com, *.abchina.com.cn, *.boc.cn, *.bankofchina.com, *.bankcomm.com, *.psbc.com, *.cmbchina.com, *.cmbimg.com, *.citicbank.com, *.cebbank.com, *.cmbc.com.cn, *.cib.com.cn, *.spdb.com.cn, *.pingan.com, *.pingan.com.cn, *.hxb.com.cn, *.cgbchina.com.cn, *.czbank.com, *.bankofbeijing.com.cn, *.bosc.cn, *.webank.com, *.zj96596.com, *.zjrc.com, *.gffunds.com.cn, *.nffund.com, *.10086.cn, *.chinamobile.com, *.10010.com, *.chinaunicom.cn, *.189.cn, *.chinatelecom.com.cn, *.3gppnetwork.org, *.anticheatexpert.com

# 真实 IP：Apple 认证 / 推送、微软邮件、NTP / STUN 不使用虚拟 IP，避免握手失败与时间同步异常。
always-real-ip = *.apple.com, *.icloud.com, *.icloud.com.cn, *.push.apple.com, *.apple-cloudkit.com, *.me.com, *.mzstatic.com, *.cdn-apple.com, *.aaplimg.com, *.itunes.com, *.apple-dns.net, identity.apple.com, gsa.apple.com, captive.apple.com, *.outlook.com, *.office365.com, *.office.com, *.msftconnecttest.com, *.msftncsi.com, time.*.com, ntp.*.com, stun.*.*, stun.*.*.*, *.local, localhost, localhost.ptlogin2.qq.com, localhost.sec.qq.com, localhost.work.weixin.qq.com, *.3gppnetwork.org, *.srv.nintendo.net, *.stun.playstation.net, xbox.*.microsoft.com, *.xboxlive.com, *.battlenet.com.cn, *.battle.net

# TUN 旁路：17.0.0.0/8 (Apple)、fe80::/10 (AWDL 隔空投送)、组播地址不进隧道，保证 AirDrop / 接力 / 通用剪贴板。
tun-excluded-routes = 10.0.0.0/8, 17.0.0.0/8, 127.0.0.0/8, 169.254.0.0/16, 172.16.0.0/12, 192.0.0.0/24, 192.0.2.0/24, 192.88.99.0/24, 192.168.0.0/16, 198.51.100.0/24, 203.0.113.0/24, 224.0.0.0/4, 255.255.255.255/32, 239.255.255.250/32, fe80::/10, ff00::/8, ff02::fb/128

# DNS：直连流量用运营商级 UDP 公共 DNS（阿里 + 腾讯），首包无需 TLS/HTTP 握手，比 DoH 少 1~2 个 RTT。
# 代理流量的域名在远端解析，不受本地 DNS 污染影响。需要防劫持时可改为：https://dns.alidns.com/dns-query, https://doh.pub/dns-query
dns-server = 223.5.5.5, 119.29.29.29
fallback-dns-server = system
# 直连域名用系统 DNS（运营商就近解析，CDN 调度最准，国内 App 加载最快）
dns-direct-system = true
dns-direct-fallback-proxy = false
hijack-dns = 8.8.8.8:53, 8.8.4.4:53
private-ip-answer = true

# 关闭 IPv6：避免 AAAA 查询与蜂窝网络 IPv6 回落带来的额外等待
ipv6 = false
prefer-ipv6 = false

icmp-auto-reply = true
always-reject-url-rewrite = false
udp-policy-not-supported-behaviour = REJECT

# 只对走代理的连接阻断 QUIC（去广告模块会对其解密的主机单独禁用 QUIC，其余直连不受影响）
block-quic = all-proxy

# WebRTC 防真实 IP 泄露
stun-response-ip = 127.0.0.1
stun-response-ipv6 = ::1

# 不拦截 mDNS / Bonjour，保证 AirDrop、通用剪贴板、接力
compatibility-mode = 1

# 配置自动更新地址
update-url = https://cdn.jsdelivr.net/gh/alloflights/shadowrocket-rules@main/Shadowrocket_LazyGroup_Merged.conf

