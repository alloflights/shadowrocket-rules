# AI稳定线路：fallback 模式，严格排除香港节点，锁定第一个可用非HK优质节点，除非节点彻底超时(5s)，否则绝不主动切换IP
AI稳定线路 = fallback,url=http://www.gstatic.com/generate_204,interval=600,timeout=5,policy-regex-filter=🇺🇸|US|USA|America|United States|美国|🇯🇵|JP|Japan|日本|🇸🇬|SG|Singapore|新加坡|🇹🇼|TW|Taiwan|台湾
