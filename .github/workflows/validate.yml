name: Validate configurations
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '23 2 * * 1'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install jq (required)
        run: sudo apt-get update && sudo apt-get install -y jq
      - run: npm run check
      - run: npm test
        env:
          CI: 'true'
  remote-rules:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run check:remotes
